<text x="904" y="473" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600" fill="#34d6a2" text-anchor="start">Shared-KV MTP4</text>
<text x="904" y="534" font-family="DejaVu Sans, Arial, sans-serif" font-size="50" font-weight="700" fill="#f5f8ff" text-anchor="start">51.46</text>
