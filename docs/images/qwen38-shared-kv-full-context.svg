<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">About 10% faster full-context decode on one B70</title><desc id="desc">Qwen3.8-27B at 230 W. Native MTP4 46.75 versus shared-KV 51.46 decode tokens per second; 10.08% gain. 212864 input plus 128 output tokens. Five matched samples per arm. Experimental; quality not yet cleared. Not a measured whole-agent speedup.</desc>
<rect x="0" y="0" width="1600.000" height="900" rx="0" fill="#0b1220"/>
<rect x="24" y="24" width="1552" height="852" rx="22" fill="none" stroke="#203047"/>
<rect x="80" y="57" width="6.000" height="26" rx="3" fill="#34d6a2"/>
<text x="104" y="78" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#a3b3c8" text-anchor="start">B70 INFERENCE / RESEARCH UPDATE</text>
<text x="1514" y="78" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#a3b3c8" text-anchor="end">OCT 2026</text>
<text x="80" y="164" font-family="DejaVu Sans, Arial, sans-serif" font-size="64" font-weight="700" fill="#f5f8ff" text-anchor="start">Faster decode. Same single GPU.</text>
<text x="84" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#a3b3c8" text-anchor="start">Qwen3.8-27B  ·  Intel Arc Pro B70  ·  230 W</text>
<text x="76" y="418" font-family="DejaVu Sans, Arial, sans-serif" font-size="148" font-weight="700" fill="#34d6a2" text-anchor="start">+10.1%</text>
<text x="84" y="479" font-family="DejaVu Sans, Arial, sans-serif" font-size="39" font-weight="600" fill="#f5f8ff" text-anchor="start">decode throughput</text>
<text x="84" y="526" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#a3b3c8" text-anchor="start">at the full supported context</text>
<text x="84" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#a3b3c8" text-anchor="start">Same target. Same prompts. Same power cap.</text>
<path d="M820 273 L820 609" stroke="#27364b" stroke-width="1.5"/>
