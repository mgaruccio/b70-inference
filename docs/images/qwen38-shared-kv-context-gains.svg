<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Shared-KV decode gains persist through full context</title><desc id="desc">Matched 230 W comparison: about 7.92% at 130944 input tokens, 9.35% at 163840, 10.25% at 196608, and 10.08% at 212864. All generate 128 tokens. Five measured samples per point; 128K comes from the preceding run. Experimental; quality not yet cleared.</desc>
<rect x="0" y="0" width="1600.000" height="900" rx="0" fill="#0b1220"/>
<rect x="24" y="24" width="1552" height="852" rx="22" fill="none" stroke="#203047"/>
<rect x="80" y="57" width="6.000" height="26" rx="3" fill="#34d6a2"/>
<text x="104" y="78" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#a3b3c8" text-anchor="start">B70 INFERENCE / RESEARCH UPDATE</text>
<text x="1514" y="78" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#a3b3c8" text-anchor="end">OCT 2026</text>
<text x="80" y="161" font-family="DejaVu Sans, Arial, sans-serif" font-size="66" font-weight="700" fill="#f5f8ff" text-anchor="start">The gain holds at full context.</text>
<text x="84" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#a3b3c8" text-anchor="start">Shared-KV vs native MTP4 · Qwen3.8-27B · One B70 at 230 W</text>
